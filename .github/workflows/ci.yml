name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history + tags so `git describe` (build-time version
          # stamp, build.zig) resolves a real tag instead of an empty string.
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Format check
        run: zig fmt --check src
