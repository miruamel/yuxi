<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Yuxi autonomous software evolution engine banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#163a45"/>
      <stop offset="1" stop-color="#1f6f6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ad6c4"/>
      <stop offset="1" stop-color="#7ef0a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#3ad6c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ad6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- motif: evolution nodes spiraling -->
  <g fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.9">
    <path d="M360 470 C 250 470 250 330 360 330 C 470 330 470 200 600 200" stroke-linecap="round"/>
    <circle cx="360" cy="470" r="14" fill="#3ad6c4"/>
    <circle cx="360" cy="330" r="11" fill="#5fe0bf"/>
    <circle cx="600" cy="200" r="9" fill="#7ef0a8"/>
    <circle cx="250" cy="400" r="6" fill="#3ad6c4" opacity="0.7"/>
    <circle cx="500" cy="270" r="5" fill="#7ef0a8" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="640" y="300" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="150" font-weight="700" fill="#f2fbf9" letter-spacing="8">玉溪</text>
  <text x="640" y="380" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="url(#accent)" letter-spacing="14">YUXI</text>
  <text x="640" y="440" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#cfe9e4" letter-spacing="3">autonomous software evolution engine</text>
</svg>
