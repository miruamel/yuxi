<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Yuxi icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163a45"/>
      <stop offset="1" stop-color="#1f6f6b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ad6c4"/>
      <stop offset="1" stop-color="#7ef0a8"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#mark)" stroke-width="6" opacity="0.6"/>

  <!-- stylized yuxi mark: ascending evolution nodes + tile glyph -->
  <g fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round">
    <path d="M120 360 C 120 300 180 300 180 240 C 180 180 250 180 250 120"/>
    <path d="M250 240 C 320 240 320 320 360 320"/>
  </g>
  <circle cx="120" cy="360" r="22" fill="#3ad6c4"/>
  <circle cx="250" cy="120" r="20" fill="#7ef0a8"/>
  <circle cx="360" cy="320" r="18" fill="#5fe0bf"/>

  <text x="256" y="430" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-weight="700" fill="#f2fbf9">溪</text>
</svg>
